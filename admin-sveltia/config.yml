# CMS TEST — Sveltia CMS, with the draft board (editorial workflow)
backend:
  name: github
  repo: harmonicworks/cms-test
  branch: main
  base_url: https://sveltia-cms-auth.harmonicworks-studio.workers.dev   # the Cloudflare login helper (or sign in with a token instead)

publish_mode: editorial_workflow   # Drafts -> In review -> Ready board

site_url: https://harmonicworks.org/cms-test
display_url: https://harmonicworks.org/cms-test
logo_url: https://harmonicworks.org/cms-test/images/favicon-192x192.png

media_folder: images/blog
public_folder: /cms-test/images/blog

# Shrink uploaded photos automatically: max 1600 px, converted to WebP, tidy file names
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  - name: posts
    label: "Blog posts"
    label_singular: "Blog post"
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description (for search results and sharing)", name: "description", widget: "text", required: false, hint: "One or two sentences. Shown in Google and when the post is shared." }
      - { label: "Publish date", name: "date", widget: "datetime", hint: "Set a future date to schedule the post. It appears on the site on that day." }
      - { label: "Preview image (for sharing)", name: "image", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Post", name: "body", widget: "markdown" }
