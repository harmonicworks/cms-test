# CMS TEST: rebuild the site once a day so future-dated (scheduled) posts appear on their date.
name: Daily rebuild for scheduled posts

on:
  schedule:
    - cron: "17 5 * * *"   # every day around 06:17 / 07:17 Dutch time
  workflow_dispatch:        # "Run workflow" button for testing

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask GitHub Pages to rebuild
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
